name: Module boundaries
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check independent routes and explicit voice scope
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = pull_request ]; then BASE="${{ github.event.pull_request.base.sha }}"; fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD^; fi
          SCOPE=pages
          if git diff --name-only "$BASE" HEAD -- deploy/voice-revision.json | rg -q .; then SCOPE=voice; fi
          python3 operations/check-module-boundaries.py "$BASE" "$SCOPE"
          php tests/page-voice-contract.php "$GITHUB_WORKSPACE"
